mcp_servers:
- ado
- binlog
- github
- microsoftdocs
mcp_configs:
  ado:
    name: ado
    transport: http
    registry: false
    url: https://mcp.dev.azure.com/arklabita
  binlog:
    name: binlog
    transport: stdio
    args:
    - dnx
    - Microsoft.AITools.BinlogMcp
    - --yes
    - --prerelease
    registry: false
    tools:
    - '*'
    command: dotnet
  github:
    name: github
    transport: http
    registry: false
    url: https://api.githubcopilot.com/mcp
  microsoftdocs:
    name: microsoftdocs
    transport: http
    registry: false
    url: https://learn.microsoft.com/api/mcp
mcp_target_servers:
  copilot:
  - ado
  - binlog
  - github
  - microsoftdocs
mcp_config_provenance:
  binlog: dotnet-msbuild
lsp_servers:
- csharp
lsp_configs:
  csharp:
    name: csharp
    command: dnx
    args:
    - roslyn-language-server
    - --yes
    - --prerelease
    - --
    - --stdio
    - --daemon-mode
    - --autoLoadProjects
    extensionToLanguage:
      .cs: csharp
      .razor: aspnetcorerazor
      .cshtml: aspnetcorerazor
    startupTimeout: 120000
lsp_target_servers:
  copilot:
  - csharp
lsp_config_provenance:
  csharp: package:dotnet/skills/plugins/dotnet
