mcp_servers:
- binlog
- microsoftdocs
mcp_configs:
  binlog:
    name: binlog
    transport: stdio
    args:
    - dnx
    - Microsoft.AITools.BinlogMcp
    - --yes
    - --prerelease
    registry: false
    tools:
    - '*'
    command: dotnet
  microsoftdocs:
    name: microsoftdocs
    transport: http
    registry: false
    url: https://learn.microsoft.com/api/mcp
mcp_target_servers: {}
mcp_config_provenance:
  binlog: dotnet-msbuild
lsp_servers:
- csharp
lsp_configs:
  csharp:
    name: csharp
    command: dnx
    args:
    - roslyn-language-server
    - --yes
    - --prerelease
    - --
    - --stdio
    - --daemon-mode
    - --autoLoadProjects
    extensionToLanguage:
      .cs: csharp
      .razor: aspnetcorerazor
      .cshtml: aspnetcorerazor
    startupTimeout: 120000
lsp_config_provenance:
  csharp: package:dotnet/skills/plugins/dotnet
