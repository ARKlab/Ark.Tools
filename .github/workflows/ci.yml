name: "CI"

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: write
  code-quality: write

jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-latest'
    env:
      ARK_SERVICEBUS_EMULATOR_CONNECTION_STRING: 'Endpoint=sb://localhost:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
          MSSQL_COLLATION: 'Latin1_General_CI_AS_KS'
          # Azure Sql is Enterprise - match it
          MSSQL_PID: EnterpriseDeveloper
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P IntegrationTestsDbPassword85! -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s
      servicebus:
        image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
        ports:
          - 5672:5672
          - 5300:5300
        env:
          ACCEPT_EULA: 'Y'
          SQL_SERVER: sqlserver
          MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
          EMULATOR_HTTP_PORT: 5300
          SQL_WAIT_INTERVAL: 30
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        env:
          AZURITE_SKIP_API_VERSION_CHECK: 'true'
        options: >-
          --health-cmd="node -e \"require('net').connect(10000, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=10s

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v7

    - name: 'Wait for Service Bus emulator'
      run: |
        timeout 300s bash -c '
          until bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/5300" 2>/dev/null \
            && bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/5672" 2>/dev/null; do
            sleep 2
          done
          sleep 5
        '

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: 'Install Azure Functions Core Tools'
      run: npm install --global azure-functions-core-tools@4.12.1

    - name: 'Restore packages'
      run: dotnet restore --locked-mode

    - name: 'Build project'
      run: dotnet build --no-restore --configuration Debug

    - name: 'Pack projects (package validation and SBOM)'
      run: dotnet pack Ark.Tools.slnx --no-restore --configuration Debug --output "${{ runner.temp }}/ark-tools-packages"

    - name: Test
      run: dotnet test --no-build --no-restore --configuration Debug --report-trx --coverage --crashdump --crashdump-type mini --hangdump --hangdump-timeout 10m --hangdump-type mini --minimum-expected-tests 1
      
    # see https://github.com/dorny/test-reporter?tab=readme-ov-file#recommended-setup-for-public-repositories
    - uses: actions/upload-artifact@v7  # upload test results
      if: success() || failure()        # run this step even if previous step failed
      with:
        name: test-results
        path: "**/*.trx"

    - name: Publish test report for same-repository pull requests
      if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: dorny/test-reporter@v3
      with:
        name: DotNET Tests
        path: "**/*.trx"
        reporter: dotnet-trx
        use-actions-summary: 'false'

    - name: Install dotnet-coverage
      run: dotnet tool install -g dotnet-coverage

    - name: Convert coverage to cobertura
      run: dotnet-coverage merge **/*.coverage -f cobertura -o coverage.cobertura.xml

    - name: Upload coverage report
      uses: actions/upload-code-coverage@v1
      with:
        file: coverage.cobertura.xml
        language: csharp
        label: Ark.Tools

    - name: Create code coverage report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:coverage.cobertura.xml -targetdir:CodeCoverage -reporttypes:'MarkdownSummaryGithub;Cobertura'

    - name: Write to Job Summary
      run: cat CodeCoverage/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: 'Upload sanitized Function host logs'
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: azure-functions-boundary-logs
        path: '/tmp/ark-azf-*.log'
        if-no-files-found: ignore
    
