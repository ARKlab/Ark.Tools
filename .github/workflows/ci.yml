name: "CI"

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: write
  code-quality: write

jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-26.04'
    env:
      ARK_SERVICEBUS_EMULATOR_CONNECTION_STRING: 'Endpoint=sb://localhost:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;'
      ARK_SFTP_TEST_URI: 'sftp://ark:ark@127.0.0.1:2222/upload'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-CU9-GDR1-ubuntu-24.04@sha256:742481d1b1186cccc81220a1eaacef244ca8d0f7d19c8e5c70df8ae541ffbab2
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
          MSSQL_COLLATION: 'Latin1_General_CI_AS_KS'
        # Boot check only: tests wait for the Service Bus emulator, which needs SQL Server ready.
        options: >-
          --health-cmd="bash -c 'echo > /dev/tcp/127.0.0.1/1433'"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60
      servicebus:
        image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
        ports:
          - 5672:5672
          - 5300:5300
        env:
          ACCEPT_EULA: 'Y'
          SQL_SERVER: sqlserver
          MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
          EMULATOR_HTTP_PORT: 5300
          SQL_WAIT_INTERVAL: 90
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        env:
          AZURITE_SKIP_API_VERSION_CHECK: 'true'
        options: >-
          --health-cmd="node -e \"require('net').connect(10000, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60
      sftp:
        image: atmoz/sftp:alpine@sha256:5301af71da01f4e4867d61b57252c35b842a79d2637fe16e8b85db9bcbbb7319
        ports:
          - 2222:22
        # Service containers take no command; the image reads the same user spec from SFTP_USERS.
        env:
          SFTP_USERS: 'ark:ark:::upload'
        options: >-
          --health-cmd="bash -c 'echo > /dev/tcp/127.0.0.1/22'"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v7

    - name: 'Install APM'
      uses: microsoft/apm-action@v1
      with:
        setup-only: true
        apm-version: 0.33.0

    - name: 'Check committed plugin and marketplace output'
      run: apm run plugins:check

    - name: 'Verify committed Copilot and Claude agents match the lockfile'
      run: apm audit --ci
      env:
        GITHUB_APM_PAT: ${{ github.token }}

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: 'Install Azure Functions Core Tools'
      # The package's postinstall downloads from cdn.functions.azure.com; retry transient network errors
      run: |
        for attempt in 1 2 3; do
          npm install --global azure-functions-core-tools@4.16.0 && exit 0
          echo "Attempt $attempt failed, retrying in 15s"
          sleep 15
        done
        exit 1

    - name: 'Restore packages'
      run: dotnet restore --locked-mode

    - name: 'Build project (including API-surface gate)'
      run: dotnet build --no-restore --configuration Debug

    # Packs the src/ projects from the build above; packing the whole solution would build it again.
    # GenerateSbom builds a .NET host per package whose config reload leaks an inotify instance in the
    # long-lived MSBuild nodes; turning reload off keeps the pack clear of fs.inotify.max_user_instances.
    - name: 'Pack projects (package validation and SBOM)'
      env:
        DOTNET_hostBuilder__reloadConfigOnChange: 'false'
      run: |
        grep -o '<Project Path="src/[^"]*"' Ark.Tools.slnx | cut -d'"' -f2 \
          | jq -R . | jq -s --arg sln "$PWD/Ark.Tools.slnx" '{solution: {path: $sln, projects: .}}' > "$RUNNER_TEMP/ark-tools-packages.slnf"
        dotnet pack "$RUNNER_TEMP/ark-tools-packages.slnf" --no-build --no-restore --configuration Debug --output "${{ runner.temp }}/ark-tools-packages"

    # The emulator warms up while the build runs; its ports open before it can serve requests.
    - name: 'Wait for Service Bus emulator'
      run: timeout 300s bash -c 'until curl -fs http://127.0.0.1:5300/health > /dev/null; do sleep 2; done'

    - name: Test
      run: dotnet test --no-build --no-restore --configuration Debug

    # AotSample is a separate solution. Its tests run with reflection-based JSON off, so a type missing from
    # AotJsonContext fails here; the end-to-end test needs ConnectionStrings__Sql and is skipped.
    - name: 'AotSample tests'
      run: |
        dotnet restore samples/Ark.MediatorFramework.AotSample/Core/Hosts/Web/Ark.MediatorFramework.AotSample.Core.Web.Tests --locked-mode
        dotnet test --project samples/Ark.MediatorFramework.AotSample/Core/Hosts/Web/Ark.MediatorFramework.AotSample.Core.Web.Tests --no-restore --configuration Debug

    # Runs SqlStateProvider in a trimmed app, where reflection-based JSON is off by default and unused members are removed.
    - name: 'Trimmed SqlStateProvider smoke test'
      run: |
        dotnet publish tests/Ark.Tools.ResourceWatcher.TrimmedApp --configuration Debug --framework net10.0 --output "${{ runner.temp }}/trimmed-app"
        "${{ runner.temp }}/trimmed-app/Ark.Tools.ResourceWatcher.TrimmedApp" tests/Ark.Tools.ResourceWatcher.Tests/appsettings.IntegrationTests.json

    # Publishes Vogen value objects through JSON, ToDataTableArk and generated Minimal API endpoints with Native AOT;
    # Ark.Tools AOT warnings fail the publish and a failing check fails the run.
    - name: 'Native AOT smoke test'
      run: |
        dotnet publish tests/Ark.Tools.MediatorFramework.NativeAotApp --configuration Debug --framework net10.0 --output "${{ runner.temp }}/native-aot-app"
        "${{ runner.temp }}/native-aot-app/Ark.Tools.MediatorFramework.NativeAotApp"
      
    # see https://github.com/dorny/test-reporter?tab=readme-ov-file#recommended-setup-for-public-repositories
    - uses: actions/upload-artifact@v7  # upload test results
      if: success() || failure()        # run this step even if previous step failed
      with:
        name: test-results
        path: "**/*.trx"

    - name: Publish test report for same-repository pull requests
      if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: dorny/test-reporter@v3
      with:
        name: DotNET Tests
        path: "**/*.trx"
        reporter: dotnet-trx
        use-actions-summary: 'false'

    - name: Install dotnet-coverage
      run: dotnet tool install -g dotnet-coverage

    - name: Convert coverage to cobertura
      run: dotnet-coverage merge **/*.coverage -f cobertura -o coverage.cobertura.xml

    - name: Upload coverage report
      uses: actions/upload-code-coverage@v1.4.4
      with:
        file: coverage.cobertura.xml
        language: 'C#'
        label: Ark.Tools

    - name: Create code coverage report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:coverage.cobertura.xml -targetdir:CodeCoverage -reporttypes:'MarkdownSummaryGithub;Cobertura'

    - name: Write to Job Summary
      run: cat CodeCoverage/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: 'Upload sanitized Function host logs'
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: azure-functions-boundary-logs
        path: '/tmp/ark-azf-*.log'
        if-no-files-found: ignore
    
