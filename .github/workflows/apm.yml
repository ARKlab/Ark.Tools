name: APM

on:
  push:
    branches: [master]
    paths:
      - apm.yml
      - apm.lock.yaml
      - agents-plugins/**
      - .claude-plugin/marketplace.json
      - .gitignore
      - .claude/**
      - .agents/**
      - .github/agents/**
      - .github/hooks/**
      - .github/mcp.json
      - .github/lsp.json
      - .mcp.json
      - .github/workflows/apm.yml
  pull_request:
    paths:
      - apm.yml
      - apm.lock.yaml
      - agents-plugins/**
      - .claude-plugin/marketplace.json
      - .gitignore
      - .claude/**
      - .agents/**
      - .github/agents/**
      - .github/hooks/**
      - .github/mcp.json
      - .github/lsp.json
      - .mcp.json
      - .github/workflows/apm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/apm-action@v1
        with:
          setup-only: true
          apm-version: 0.33.0

      - name: Check committed plugin and marketplace output
        run: apm run plugins:check

      - name: Verify committed Copilot and Claude agents match the lockfile
        run: apm audit --ci
        env:
          GITHUB_APM_PAT: ${{ github.token }}
