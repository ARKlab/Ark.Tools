name: "Deploy to NuGet"

on:
  push:
    tags:
    - 'v[0-9]+\.[0-9]+\.[0-9]+'
    - 'v[0-9]+\.[0-9]+\.[0-9]+-beta[0-9][0-9]'

env:
  PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/output
  NUGET_SOURCE_URL: 'https://api.nuget.org/v3/index.json'

permissions:
  contents: read
  code-quality: write

jobs:
  deploy:
    name: 'Nuget Push'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: 'ubuntu-latest'
    env:
      ARK_SERVICEBUS_EMULATOR_CONNECTION_STRING: 'Endpoint=sb://localhost:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
          MSSQL_COLLATION: 'Latin1_General_CI_AS_KS'
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P IntegrationTestsDbPassword85! -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s
          # Azure Sql is Enterprise - match it
          MSSQL_PID: EnterpriseDeveloper
      servicebus:
        image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
        ports:
          - 5672:5672
          - 5300:5300
        env:
          ACCEPT_EULA: 'Y'
          SQL_SERVER: sqlserver
          MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
          EMULATOR_HTTP_PORT: 5300
          SQL_WAIT_INTERVAL: 15
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        env:
          AZURITE_SKIP_API_VERSION_CHECK: 'true'
        options: >-
          --health-cmd="node -e \"require('net').connect(10000, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=10s

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v7

    - name: 'Wait for Service Bus emulator'
      run: |
        timeout 300s bash -c '
          until bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/5300" 2>/dev/null \
            && bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/5672" 2>/dev/null; do
            sleep 2
          done
          sleep 5
        '

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: 'Get Version'
      id: version
      uses: battila7/get-version-action@v2

    - name: Build
      run: dotnet build --configuration Debug

    - name: 'Build project (dacpac copy issue)'
      run: dotnet build --configuration Debug
      
    - name: Test
      run: dotnet test --no-build --no-restore --configuration Debug --report-trx --coverage --crashdump --crashdump-type mini --hangdump --hangdump-timeout 10m --hangdump-type mini --minimum-expected-tests 1

    - name: Install dotnet-coverage
      run: dotnet tool install -g dotnet-coverage

    - name: Convert coverage to cobertura
      run: dotnet-coverage merge **/*.coverage -f cobertura -o coverage.cobertura.xml

    - name: Upload coverage report
      uses: actions/upload-code-coverage@v1
      with:
        file: coverage.cobertura.xml
        language: csharp
        label: Ark.Tools

    - name: 'Pack project'
      run: dotnet pack --configuration Release --include-symbols -p:Version=${{ steps.version.outputs.version-without-v }} --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }}

    # These packages remain preview-only until their release contract is finalized.
    - name: 'Exclude preview-only packages'
      run: |
        rm -f \
          ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/Ark.Tools.MediatorFramework*.nupkg \
          ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/Ark.Tools.Nodatime.Protobuf*.nupkg
    - name: 'Push package'
      run: dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg -k ${{ secrets.NUGET_AUTH_TOKEN }} -s ${{ env.NUGET_SOURCE_URL }}
