name: "Deploy to NuGet"

on:
  push:
    tags:
    - 'v[0-9]+\.[0-9]+\.[0-9]+'
    - 'v[0-9]+\.[0-9]+\.[0-9]+-beta[0-9][0-9]'

env:
  PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/output
  NUGET_SOURCE_URL: 'https://api.nuget.org/v3/index.json'

permissions:
  contents: read
  code-quality: write

jobs:
  deploy:
    name: 'Build, test and pack'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: 'ubuntu-26.04'
    env:
      ARK_SERVICEBUS_EMULATOR_CONNECTION_STRING: 'Endpoint=sb://localhost:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;'
      ARK_SFTP_TEST_URI: 'sftp://ark:ark@127.0.0.1:2222/upload'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-CU10-GDR1-ubuntu-24.04@sha256:21cba63f9e5f93ae72d211e50bceca8f047a6233da18ed5ecb497152f97eca7b
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
          MSSQL_COLLATION: 'Latin1_General_CI_AS_KS'
        # Boot check only: tests wait for the Service Bus emulator, which needs SQL Server ready.
        options: >-
          --health-cmd="bash -c 'echo > /dev/tcp/127.0.0.1/1433'"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60
      servicebus:
        image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
        ports:
          - 5672:5672
          - 5300:5300
        env:
          ACCEPT_EULA: 'Y'
          SQL_SERVER: sqlserver
          MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
          EMULATOR_HTTP_PORT: 5300
          SQL_WAIT_INTERVAL: 90
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        env:
          AZURITE_SKIP_API_VERSION_CHECK: 'true'
        options: >-
          --health-cmd="node -e \"require('net').connect(10000, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60
      sftp:
        image: atmoz/sftp:alpine@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372
        ports:
          - 2222:22
        # Service containers take no command; the image reads the same user spec from SFTP_USERS.
        env:
          SFTP_USERS: 'ark:ark:::upload'
        options: >-
          --health-cmd="bash -c 'echo > /dev/tcp/127.0.0.1/22'"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v7

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: 'Install Azure Functions Core Tools'
      run: npm install --global azure-functions-core-tools@4.16.0

    - name: 'Get Version'
      id: version
      uses: battila7/get-version-action@v2

    - name: Build
      run: dotnet build --configuration Debug

    - name: 'Build project (dacpac copy issue)'
      run: dotnet build --configuration Debug
      
    # The emulator warms up while the build runs; its ports open before it can serve requests.
    - name: 'Wait for Service Bus emulator'
      run: timeout 300s bash -c 'until curl -fs http://127.0.0.1:5300/health > /dev/null; do sleep 2; done'

    - name: Test
      run: dotnet test --no-build --no-restore --configuration Debug

    - name: 'Pack project'
      run: dotnet pack --configuration Release -p:Version=${{ steps.version.outputs.version-without-v }} --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }}

    - name: 'Upload packages'
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: ${{ env.PACKAGE_OUTPUT_DIRECTORY }}
        if-no-files-found: error

  # Only this job can request an OIDC token, so build and test code cannot mint a NuGet key.
  publish:
    name: 'Nuget Push'
    needs: deploy
    runs-on: 'ubuntu-26.04'
    # The nuget.org policy accepts only this environment, and the environment accepts only release tags.
    environment: nuget
    permissions:
      id-token: write # NuGet trusted publishing: the OIDC token is exchanged for a one-hour API key

    steps:
    - name: 'Download packages'
      uses: actions/download-artifact@v8
      with:
        name: packages
        path: ${{ env.PACKAGE_OUTPUT_DIRECTORY }}

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: 'NuGet login'
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0, pinned: this step handles the publish credential
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: 'Push package'
      run: dotnet nuget push ${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s ${{ env.NUGET_SOURCE_URL }} --skip-duplicate
