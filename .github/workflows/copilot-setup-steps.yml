name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    env:
      ARK_SERVICEBUS_EMULATOR_CONNECTION_STRING: 'Endpoint=sb://localhost:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;'

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
          MSSQL_COLLATION: 'Latin1_General_CI_AS_KS'
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P IntegrationTestsDbPassword85! -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s
      servicebus:
        image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
        ports:
          - 5672:5672
          - 5300:5300
        env:
          ACCEPT_EULA: 'Y'
          SQL_SERVER: sqlserver
          MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
          EMULATOR_HTTP_PORT: 5300
          SQL_WAIT_INTERVAL: 90
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        env:
          AZURITE_SKIP_API_VERSION_CHECK: 'true'
        options: >-
          --health-cmd="node -e \"require('net').connect(10000, 'localhost').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=10s

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: 'Wait for Service Bus emulator'
        run: |
          timeout 300s bash -c '
            until bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/5300" 2>/dev/null \
              && bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/5672" 2>/dev/null; do
              sleep 2
            done
            sleep 5
          '

      - name: Install dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 'Install Azure Functions Core Tools'
        run: npm install --global azure-functions-core-tools@4.12.1
