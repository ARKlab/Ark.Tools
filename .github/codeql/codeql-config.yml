paths-ignore:
  - 'docs/**'
  - 'tests/**'
  # Test projects living next to the samples (e.g. *.Core.Tests)
  - '**/*.Tests/**'

threat-models: local

queries:
  - uses: security-and-quality

query-filters:
  - exclude:
      id: cs/linq/missed-where
  - exclude:
      id: cs/linq/missed-select
  - exclude:
      id: cs/simplifiable-boolean-expression
  - exclude:
      id: cs/complex-condition
