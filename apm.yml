name: Ark.Tools
version: 1.3.0
description: APM project for Ark.Tools
author: Andrea Cuneo
license: MIT
targets:
  - copilot
includes: auto
scripts:
  plugins:build: pwsh -NoProfile -File agents-plugins/Build-Plugin.ps1
  plugins:check: pwsh -NoProfile -File agents-plugins/Build-Plugin.ps1 -Check
devDependencies:
  apm:
    - microsoft/apm/packages/apm-guide#main
    - Aaronontheweb/dotnet-skills/skills/aot-trimming#master
    - Aaronontheweb/dotnet-skills/skills/opentelementry-dotnet-instrumentation#master
    - dotnet/skills/plugins/dotnet#main
    - dotnet/skills/plugins/dotnet-diag#main
    - dotnet/skills/plugins/dotnet-msbuild#main
    - obra/superpowers#main
    - DietrichGebert/ponytail#v4.10.0
    - ./agents-plugins/ark-csharp
  mcp:
    - name: ado
      registry: false
      transport: http
      url: https://mcp.dev.azure.com/arklabita
    - name: microsoftdocs
      registry: false
      transport: http
      url: https://learn.microsoft.com/api/mcp
    - name: github
      registry: false
      transport: http
      url: https://api.githubcopilot.com/mcp
marketplace:
  name: Ark.Tools
  owner:
    name: ARKlab
    url: https://github.com/ARKlab

  versioning:
    strategy: per_package

  metadata:
    homepage: https://github.com/ARKlab/Ark.Tools

  outputs:
    claude: {}

  packages:
    - name: ark-csharp
      description: Ark CSharp development skills and agents
      source: ./agents-plugins/published/ark-csharp
      version: 1.3.0
