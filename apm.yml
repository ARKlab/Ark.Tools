name: Ark.Tools
version: 1.3.0
description: APM project for Ark.Tools
author: Andrea Cuneo
license: MIT
targets:
  - copilot
  - claude
includes: auto
scripts:
  plugins:build: pwsh -NoProfile -File agents-plugins/Build-Plugin.ps1
  plugins:check: pwsh -NoProfile -File agents-plugins/Build-Plugin.ps1 -Check
devDependencies:
  apm:
    - microsoft/apm/packages/apm-guide#v0.34.0
    - Aaronontheweb/dotnet-skills/skills/aot-trimming#v1.7.1
    - Aaronontheweb/dotnet-skills/skills/opentelementry-dotnet-instrumentation#v1.7.1
    - dotnet/skills/plugins/dotnet#9de888b8ce55da34e76a113bd7b2d463d6b3e1e6 # main
    - dotnet/skills/plugins/dotnet-diag#9de888b8ce55da34e76a113bd7b2d463d6b3e1e6 # main
    - dotnet/skills/plugins/dotnet-msbuild#9de888b8ce55da34e76a113bd7b2d463d6b3e1e6 # main
    - obra/superpowers#v7.0.1
    - DietrichGebert/ponytail#v5.3.3
    - ./agents-plugins/ark-csharp
  mcp:
    - name: microsoftdocs
      registry: false
      transport: http
      url: https://learn.microsoft.com/api/mcp
marketplace:
  name: Ark.Tools
  owner:
    name: ARKlab
    url: https://github.com/ARKlab

  versioning:
    strategy: per_package

  metadata:
    homepage: https://github.com/ARKlab/Ark.Tools

  outputs:
    claude: {}

  packages:
    - name: ark-csharp
      description: Ark CSharp development skills and agents
      source: ./agents-plugins/published/ark-csharp
      version: 1.4.0
