name: $(SourceBranchName)_$(date:yyyyMMdd)$(rev:.r)

# Functions variant: Azure Functions (isolated worker) with native Ark messaging.
trigger:
  branches:
    include:
      - develop
      - master
  paths:
    include:
      - samples/Ark.MediatorFramework.Sample/Core/Ark.MediatorFramework.Sample.Core.*
      - samples/Ark.MediatorFramework.Sample/Core/Hosts/Functions/*
      - samples/Ark.MediatorFramework.Sample/Directory.Build.props
      - samples/Ark.MediatorFramework.Sample/Directory.Build.targets
      - samples/Ark.MediatorFramework.Sample/Directory.Packages.props
      - samples/Ark.MediatorFramework.Sample/global.json
      - samples/Ark.MediatorFramework.Sample/.globalconfig
      - samples/Ark.MediatorFramework.Sample/Ark.MediatorFramework.Sample.slnx
      - samples/Ark.MediatorFramework.Sample/docker-compose.yml
      - samples/Ark.MediatorFramework.Sample/Ark.MediatorFramework.Sample.Core.Functions.yml
      - samples/Ark.MediatorFramework.Sample/Ark.MediatorFramework.Sample.Core.Functions.buildStage.yml
      - samples/Ark.MediatorFramework.Sample/Ark.MediatorFramework.Sample.Core.Functions.deployStage.yml

pr:
  branches:
    include:
      - develop
      - master
  drafts: false
  paths:
    include:
      - samples/Ark.MediatorFramework.Sample/Core/Ark.MediatorFramework.Sample.Core.*
      - samples/Ark.MediatorFramework.Sample/Core/Hosts/Functions/*
      - samples/Ark.MediatorFramework.Sample/Directory.Build.props
      - samples/Ark.MediatorFramework.Sample/Directory.Build.targets
      - samples/Ark.MediatorFramework.Sample/Directory.Packages.props
      - samples/Ark.MediatorFramework.Sample/global.json
      - samples/Ark.MediatorFramework.Sample/.globalconfig
      - samples/Ark.MediatorFramework.Sample/Ark.MediatorFramework.Sample.slnx
      - samples/Ark.MediatorFramework.Sample/docker-compose.yml
      - samples/Ark.MediatorFramework.Sample/Ark.MediatorFramework.Sample.Core.Functions.yml
      - samples/Ark.MediatorFramework.Sample/Ark.MediatorFramework.Sample.Core.Functions.buildStage.yml
      - samples/Ark.MediatorFramework.Sample/Ark.MediatorFramework.Sample.Core.Functions.deployStage.yml

resources:
  containers:
  # Same SQL Server image and settings as .github/workflows/ci.yml.
  - container: sqlserver
    image: mcr.microsoft.com/mssql/server:2025-latest
    env:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
      MSSQL_COLLATION: Latin1_General_CI_AS_KS
    ports:
      - 1433:1433

  # Same Service Bus emulator image and environment as .github/workflows/ci.yml.
  # Reaches SQL Server through the service alias "sqlserver".
  - container: servicebus
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    env:
      ACCEPT_EULA: 'Y'
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
      EMULATOR_HTTP_PORT: '5300'
      SQL_WAIT_INTERVAL: '90'
    ports:
      - 5672:5672
      - 5300:5300

variables:
  workingDirectory: '$(Build.SourcesDirectory)/samples/Ark.MediatorFramework.Sample'
  vmImageName: 'ubuntu-22.04'
  buildConfiguration: 'Release'
  enableDeployment: 'false'

stages:
  - template: Ark.MediatorFramework.Sample.Core.Functions.buildStage.yml
    parameters:
      name: Build_Stage
      workingDirectory: ${{ variables.workingDirectory }}
      vmImageName: ${{ variables.vmImageName }}
      buildConfiguration: ${{ variables.buildConfiguration }}

  # Enable only after configuring the Azure service connection, environment,
  # and app names in this pipeline.
  - ${{ if eq(variables.enableDeployment, 'true') }}:
      - template: Ark.MediatorFramework.Sample.Core.Functions.deployStage.yml
        parameters:
          name: Deploy_Stage
          dependsOn: Build_Stage
          vmImageName: ${{ variables.vmImageName }}
          environmentName: Ark-MediatorFramework-Sample-Functions
          azureServiceConnection: Ark-MediatorFramework-Sample
          apiFunctionAppName: replace-with-api-function-app-name
          processorFunctionAppName: replace-with-processor-function-app-name
          notificationsFunctionAppName: replace-with-notifications-function-app-name
          auditFunctionAppName: replace-with-audit-function-app-name
