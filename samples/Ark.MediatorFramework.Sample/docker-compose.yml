services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    restart: unless-stopped
    command: azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    environment:
      AZURITE_SKIP_API_VERSION_CHECK: 'true'
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: IntegrationTestsDbPassword85!
      MSSQL_COLLATION: Latin1_General_CI_AS_KS
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P IntegrationTestsDbPassword85! -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "1433:1433"

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ACCEPT_EULA: 'Y'
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: 'IntegrationTestsDbPassword85!'
      EMULATOR_HTTP_PORT: 5300
      SQL_WAIT_INTERVAL: 90
    ports:
      - "5300:5300"
      - "5672:5672"