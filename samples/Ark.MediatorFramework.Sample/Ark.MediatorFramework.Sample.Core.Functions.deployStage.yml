parameters:
  - name: name
    type: string
  - name: dependsOn
    type: string
  - name: vmImageName
    type: string
  - name: environmentName
    type: string
  - name: azureServiceConnection
    type: string
  - name: apiFunctionAppName
    type: string
  - name: processorFunctionAppName
    type: string
  - name: notificationsFunctionAppName
    type: string
  - name: auditFunctionAppName
    type: string

stages:
  - stage: ${{ parameters.name }}
    displayName: ${{ parameters.name }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    jobs:
      - deployment: DeployHosts
        displayName: Deploy sample Functions hosts
        environment: ${{ parameters.environmentName }}
        pool:
          vmImage: ${{ parameters.vmImageName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: mediator-framework-sample-functions

                # The remaining hosts are published as independent artifacts because
                # their hosting target is environment-specific (WebJob, Container
                # Apps, VM, or another worker host). Deploy each with that target's
                # approved task before enabling this stage in a real environment.
                - script: |
                    echo "OutboxProcessor: $(Pipeline.Workspace)/mediator-framework-sample-functions/OutboxProcessor"
                    echo "Database DACPAC: $(Pipeline.Workspace)/mediator-framework-sample-functions/database"
                  displayName: Inspect remaining host and database artifacts

                - task: AzureFunctionApp@2
                  displayName: Deploy Api
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    appType: functionAppLinux
                    appName: ${{ parameters.apiFunctionAppName }}
                    package: '$(Pipeline.Workspace)/mediator-framework-sample-functions/Api'

                - task: AzureFunctionApp@2
                  displayName: Deploy Processor
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    appType: functionAppLinux
                    appName: ${{ parameters.processorFunctionAppName }}
                    package: '$(Pipeline.Workspace)/mediator-framework-sample-functions/Processor'

                - task: AzureFunctionApp@2
                  displayName: Deploy Notifications
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    appType: functionAppLinux
                    appName: ${{ parameters.notificationsFunctionAppName }}
                    package: '$(Pipeline.Workspace)/mediator-framework-sample-functions/Notifications'

                - task: AzureFunctionApp@2
                  displayName: Deploy Audit
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    appType: functionAppLinux
                    appName: ${{ parameters.auditFunctionAppName }}
                    package: '$(Pipeline.Workspace)/mediator-framework-sample-functions/Audit'
